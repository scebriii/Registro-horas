<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Horas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #f4f3f0;
  --surface: #ffffff;
  --surface2: #fafaf8;
  --border: #e8e6e1;
  --border2: #d4d1ca;
  --text: #1a1917;
  --text2: #6b6860;
  --text3: #9e9b95;
  --ink: #2c2b28;
  --accent: #2a5c45;
  --accent-light: #e8f2ed;
  --accent-mid: #4a8c6a;
  --warn: #b05c1a;
  --warn-light: #fdf0e6;
  --danger: #c0392b;
  --danger-light: #fdf0ef;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}
.topbar-logo { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; }
.topbar-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.topbar-spacer { flex: 1; }
.topbar-contract {
  font-family: var(--mono); font-size: 10px; color: var(--text2);
  background: var(--bg); padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border); white-space: nowrap;
}

/* ── DESKTOP LAYOUT ── */
@media (min-width: 768px) {
  .app-body {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 52px);
  }
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--surface);
  }
  .main-panel {
    overflow-y: auto;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .mobile-tabs { display: none; }
  .mobile-nav { display: none; }
  .sidebar, .main-panel { display: flex !important; }
}

/* ── MOBILE LAYOUT ── */
@media (max-width: 767px) {
  .app-body { display: block; padding-bottom: 70px; }

  .sidebar {
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .sidebar.active { display: flex; }

  .main-panel {
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .main-panel.active { display: flex; }

  .mobile-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .mobile-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .mobile-nav-btn.active { color: var(--accent); }
  .mobile-nav-btn svg { width: 20px; height: 20px; }

  .mobile-nav-indicator {
    position: absolute;
    top: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 0 0 2px 2px;
    width: 33.33%;
    transition: left 0.25s cubic-bezier(.4,0,.2,1);
  }
}

/* ── KPI CARDS ── */
.kpi-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.kpi-card.green { background: var(--accent-light); border-color: #b8d9c8; }
.kpi-label { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.5px; line-height: 1; }
.kpi-card.green .kpi-value { color: var(--accent); }
.kpi-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.progress-track { height: 4px; background: var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
.progress-fill.over { background: var(--warn); }

/* mobile: kpis in a row */
@media (max-width: 767px) {
  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-row .kpi-card { margin-bottom: 0; }
  .kpi-card.green { grid-column: span 2; }
  .kpi-value { font-size: 20px; }
}

.section-head { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* ── ENTRIES ── */
.entries-scroll { display: flex; flex-direction: column; gap: 6px; }

.entry-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface);
  font-size: 13px; transition: border-color 0.15s;
  animation: rowIn 0.18s ease;
}
@keyframes rowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
.entry-row.is-extra { border-left: 2px solid var(--warn); }
.entry-date-tag { font-family: var(--mono); font-size: 10px; color: var(--text3); min-width: 52px; }
.entry-info { flex: 1; min-width: 0; }
.entry-h { font-weight: 500; font-size: 13px; color: var(--ink); }
.entry-note { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-pill { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--bg); color: var(--text2); border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; }
.entry-pill.extra { background: var(--warn-light); color: var(--warn); border-color: #e8c9a8; }
.btn-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 4px; transition: all 0.15s; flex-shrink: 0; }
.btn-del:hover { background: var(--danger-light); color: var(--danger); }
.no-entries { text-align: center; padding: 24px; font-family: var(--mono); font-size: 11px; color: var(--text3); border: 1px dashed var(--border); border-radius: var(--radius-sm); line-height: 1.8; }

/* ── CALENDAR ── */
.calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.cal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); gap: 10px; }
.cal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; flex: 1; text-transform: capitalize; }
.cal-nav { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-size: 15px; padding: 5px 11px; transition: all 0.15s; font-family: var(--sans); min-width: 36px; }
.cal-nav:hover { background: var(--bg); }
.cal-today-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); cursor: pointer; font-size: 11px; font-family: var(--mono); padding: 5px 10px; transition: all 0.15s; }
.cal-today-btn:hover { background: var(--bg); }

.cal-grid { padding: 12px 16px 16px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
.cal-wd { text-align: center; font-family: var(--mono); font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 2px; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 5px 3px 3px;
  border-radius: 7px; border: 1px solid transparent;
  cursor: pointer; transition: all 0.15s; min-height: 44px;
  -webkit-tap-highlight-color: transparent;
}
.cal-day:active:not(.empty) { transform: scale(0.93); }
@media (min-width: 768px) { .cal-day:hover:not(.empty) { background: var(--bg); border-color: var(--border); } }
.cal-day.empty { cursor: default; }
.cal-day.is-today .day-num { background: var(--accent); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.cal-day.has-hours { background: var(--accent-light); border-color: #c8dfd4; }
.cal-day.has-extra { background: var(--warn-light); border-color: #e8c9a8; }
.day-num { font-size: 12px; font-weight: 500; color: var(--ink); line-height: 22px; }
.cal-day.other-month .day-num { color: var(--text3); opacity: 0.4; }
.day-hours { font-family: var(--mono); font-size: 8px; color: var(--accent); margin-top: 1px; font-weight: 500; }
.cal-day.has-extra .day-hours { color: var(--warn); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text3); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* ── WEEK BARS ── */
.week-summary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.week-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 14px; }
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: flex-end; }
.week-bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week-bar-track { width: 100%; height: 56px; background: var(--bg); border-radius: 4px; position: relative; overflow: hidden; }
.week-bar-fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent-light); border-top: 2px solid var(--accent); border-radius: 2px 2px 0 0; transition: height 0.4s cubic-bezier(.4,0,.2,1); }
.week-bar-fill.is-today-bar { background: var(--accent); border-color: var(--accent); opacity: 0.9; }
.week-bar-fill.is-extra { background: var(--warn-light); border-color: var(--warn); }
.week-bar-label { font-family: var(--mono); font-size: 9px; color: var(--text3); text-transform: uppercase; }
.week-bar-h { font-family: var(--mono); font-size: 9px; color: var(--text2); }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0; background: rgba(26,25,23,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 0.2s; backdrop-filter: blur(2px);
}
@media (min-width: 768px) { .overlay { align-items: center; } }
.overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 480px;
  padding: 24px 20px 32px;
  transform: translateY(20px);
  transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
@media (min-width: 768px) {
  .modal { border-radius: 16px; width: 360px; padding: 28px; transform: translateY(8px) scale(0.98); }
  .overlay.open .modal { transform: translateY(0) scale(1); }
}
.overlay.open .modal { transform: translateY(0); }

.modal-drag { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
@media (min-width: 768px) { .modal-drag { display: none; } }

.modal-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
.modal-date { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 20px; text-transform: capitalize; }
.modal-existing { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; }
.modal-existing-label { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.modal-existing-val { font-weight: 500; color: var(--accent); font-size: 15px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-family: var(--mono); font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; }
input[type="time"], input[type="text"] {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--ink); font-family: var(--mono); font-size: 15px;
  padding: 12px 14px; outline: none; width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,92,69,0.12); }

.modal-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-primary {
  flex: 1; background: var(--accent); color: white; border: none;
  border-radius: var(--radius-sm); font-family: var(--sans); font-weight: 500;
  font-size: 15px; padding: 13px; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost {
  background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text2); font-family: var(--sans); font-size: 15px;
  padding: 13px 16px; cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { background: var(--bg); }
.btn-danger-ghost {
  background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
  color: var(--danger); font-family: var(--sans); font-size: 13px;
  padding: 10px 12px; cursor: pointer; transition: all 0.15s; margin-top: 6px; width: 100%;
}
.btn-danger-ghost:hover { background: var(--danger-light); }
</style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Mis Horas</span>
  <div class="topbar-dot"></div>
  <div class="topbar-spacer"></div>
  <span class="topbar-contract">660 € · 15h/sem</span>
</header>

<div class="app-body">
  <!-- SIDEBAR / Tab: Resumen -->
  <aside class="sidebar active" id="tab-resumen">
    <div id="kpi-block"></div>
    <div class="section-head">Últimas entradas</div>
    <div class="entries-scroll" id="entries-list"></div>
  </aside>

  <!-- MAIN / Tab: Calendario -->
  <main class="main-panel" id="tab-calendario">
    <div class="calendar-card">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <button class="cal-today-btn" onclick="goToday()">Hoy</button>
        <span class="cal-title" id="cal-title"></span>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        <div class="cal-weekdays">
          <div class="cal-wd">L</div><div class="cal-wd">M</div>
          <div class="cal-wd">X</div><div class="cal-wd">J</div>
          <div class="cal-wd">V</div><div class="cal-wd">S</div>
          <div class="cal-wd">D</div>
        </div>
        <div class="cal-days" id="cal-days"></div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#b8d9c8;border:1px solid #4a8c6a;"></div>Registrado</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e8c9a8;border:1px solid #b05c1a;"></div>Extra</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2a5c45;border-radius:50%;"></div>Hoy</div>
      </div>
    </div>
    <div class="week-summary">
      <div class="week-title">Semana actual</div>
      <div class="week-bars" id="week-bars"></div>
    </div>
  </main>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-nav" id="mobile-nav">
  <div class="mobile-nav-indicator" id="nav-indicator"></div>
  <button class="mobile-nav-btn active" id="btn-resumen" onclick="switchTab('resumen', 0)">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M3 6h18M3 18h18"/></svg>
    Resumen
  </button>
  <button class="mobile-nav-btn" id="btn-calendario" onclick="switchTab('calendario', 1)">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18"/></svg>
    Calendario
  </button>
</nav>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modal-title">Registrar horas</div>
    <div class="modal-date" id="modal-date"></div>
    <div id="modal-existing"></div>
    <div class="field">
      <label>Horas trabajadas</label>
      <input type="time" id="inp-hours" value="03:00">
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <input type="text" id="inp-note" placeholder="Ej: turno tarde">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModalDirect()">Cancelar</button>
      <button class="btn-primary" onclick="saveEntry()">Guardar</button>
    </div>
    <button class="btn-danger-ghost" id="btn-delete-day" style="display:none" onclick="deleteDayEntry()">Eliminar entrada de este día</button>
  </div>
</div>

<script>
const CONTRATO_H_SEM = 15;
const PRECIO_H = 660 / (15 * 4.33);
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

let entries = JSON.parse(localStorage.getItem('horas_v2') || '[]');
let viewDate = new Date();
let selectedDateStr = null;

function save() { localStorage.setItem('horas_v2', JSON.stringify(entries)); }
function toStr(d) { return d.toISOString().slice(0,10); }
function todayStr() { return toStr(new Date()); }
function timeToH(t) { const [h,m] = t.split(':').map(Number); return h + m/60; }
function formatH(h) {
  if (!h) return '0h';
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return mm > 0 ? `${hh}h ${mm}m` : `${hh}h`;
}

function getWeekStart(dateStr) {
  const d = new Date(dateStr+'T12:00:00');
  const day = d.getDay()===0 ? 7 : d.getDay();
  d.setDate(d.getDate()-day+1);
  return toStr(d);
}
function getWeekDays(ws) {
  const days=[], d=new Date(ws+'T12:00:00');
  for(let i=0;i<7;i++){days.push(toStr(d));d.setDate(d.getDate()+1);}
  return days;
}
function getEntry(dateStr) { return entries.find(e=>e.date===dateStr)||null; }
function getWeekHours(ws) {
  return getWeekDays(ws).reduce((s,d)=>{const e=getEntry(d);return s+(e?e.hours:0);},0);
}
function isExtra(dateStr) {
  const ws=getWeekStart(dateStr); let cumul=0;
  for(const d of getWeekDays(ws)){
    const e=getEntry(d); if(!e) continue;
    if(d===dateStr && cumul>=CONTRATO_H_SEM) return true;
    cumul+=e.hours;
  }
  return false;
}

// ── TAB SWITCHING (mobile) ──
function switchTab(tab, idx) {
  document.getElementById('tab-resumen').classList.toggle('active', tab==='resumen');
  document.getElementById('tab-calendario').classList.toggle('active', tab==='calendario');
  document.querySelectorAll('.mobile-nav-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('nav-indicator').style.left = (idx*50)+'%';
}

// ── KPIS ──
function renderKPIs() {
  const now = new Date();
  const ws = getWeekStart(todayStr());
  const monthEntries = entries.filter(e=>{
    const d=new Date(e.date+'T12:00:00');
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  const horasSem = getWeekHours(ws);
  const horasMes = monthEntries.reduce((s,e)=>s+e.hours,0);
  const extrasSem = Math.max(0,horasSem-CONTRATO_H_SEM);
  const pagoMes = horasMes*PRECIO_H;
  const pct = Math.min(100,(horasSem/CONTRATO_H_SEM)*100);

  document.getElementById('kpi-block').innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card green">
        <div class="kpi-label">A cobrar (mes)</div>
        <div class="kpi-value">${pagoMes.toFixed(0)} €</div>
        <div class="kpi-sub">${formatH(horasMes)} registradas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Esta semana</div>
        <div class="kpi-value">${formatH(horasSem)}<span style="font-size:12px;font-weight:400;color:var(--text3)"> /15h</span></div>
        <div class="progress-track"><div class="progress-fill ${pct>=100?'over':''}" style="width:${pct}%"></div></div>
        <div class="kpi-sub">${pct>=100?`⚡ ${formatH(extrasSem)} extra`:`${formatH(CONTRATO_H_SEM-horasSem)} restantes`}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Días (mes)</div>
        <div class="kpi-value">${monthEntries.length}</div>
        <div class="kpi-sub">días trabajados</div>
      </div>
    </div>
  `;
}

// ── ENTRIES ──
function renderEntries() {
  const sorted = [...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  const container = document.getElementById('entries-list');
  if(!sorted.length){
    container.innerHTML='<div class="no-entries">Sin entradas aún.<br>Ve al calendario y toca un día.</div>';
    return;
  }
  container.innerHTML = sorted.map(e=>{
    const d=new Date(e.date+'T12:00:00');
    const label=d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
    const extra=isExtra(e.date);
    const ganado=(e.hours*PRECIO_H).toFixed(2);
    return `
      <div class="entry-row ${extra?'is-extra':''}">
        <span class="entry-date-tag">${label}</span>
        <div class="entry-info">
          <div class="entry-h">${formatH(e.hours)}</div>
          ${e.note?`<div class="entry-note">${e.note}</div>`:''}
        </div>
        <span class="entry-pill ${extra?'extra':''}">${extra?'Extra':ganado+'€'}</span>
        <button class="btn-del" onclick="deleteById(${e.id},event)">×</button>
      </div>`;
  }).join('');
}

function deleteById(id,ev){
  ev.stopPropagation();
  entries=entries.filter(e=>e.id!==id);
  save();render();
}

// ── CALENDAR ──
function renderCalendar(){
  const year=viewDate.getFullYear(), month=viewDate.getMonth();
  document.getElementById('cal-title').textContent=
    viewDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

  const firstDay=new Date(year,month,1);
  let startDow=firstDay.getDay(); startDow=startDow===0?6:startDow-1;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevDays=new Date(year,month,0).getDate();
  const cells=[];

  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i,current:false});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,current:true});
  while(cells.length%7!==0) cells.push({day:cells.length-startDow-daysInMonth+1,current:false});

  document.getElementById('cal-days').innerHTML=cells.map(cell=>{
    if(!cell.current) return `<div class="cal-day other-month empty"><span class="day-num">${cell.day}</span></div>`;
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`;
    const isToday=dateStr===todayStr();
    const entry=getEntry(dateStr);
    const extra=entry&&isExtra(dateStr);
    let cls='cal-day';
    if(isToday) cls+=' is-today';
    if(entry&&!extra) cls+=' has-hours';
    if(extra) cls+=' has-extra';
    return `
      <div class="${cls}" onclick="openModal('${dateStr}')">
        <span class="day-num">${cell.day}</span>
        ${entry?`<span class="day-hours">${formatH(entry.hours)}</span>`:''}
      </div>`;
  }).join('');
}

// ── WEEK BARS ──
function renderWeekBars(){
  const ws=getWeekStart(todayStr()), days=getWeekDays(ws);
  const maxH=Math.max(3,...days.map(d=>{const e=getEntry(d);return e?e.hours:0;}));
  document.getElementById('week-bars').innerHTML=days.map((d,i)=>{
    const entry=getEntry(d), h=entry?entry.hours:0;
    const pct=(h/maxH)*100, isT=d===todayStr(), extra=entry&&isExtra(d);
    return `
      <div class="week-bar-col">
        <div class="week-bar-track">
          <div class="week-bar-fill ${isT&&h?'is-today-bar':''} ${extra?'is-extra':''}" style="height:${pct}%"></div>
        </div>
        <span class="week-bar-label" style="${isT?'color:var(--accent);font-weight:500':''}">${DIAS[i].slice(0,1)}</span>
        <span class="week-bar-h">${h?formatH(h):'—'}</span>
      </div>`;
  }).join('');
}

// ── MODAL ──
function openModal(dateStr){
  selectedDateStr=dateStr;
  const d=new Date(dateStr+'T12:00:00');
  document.getElementById('modal-date').textContent=
    d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const entry=getEntry(dateStr);
  const existing=document.getElementById('modal-existing');
  if(entry){
    document.getElementById('modal-title').textContent='Editar horas';
    existing.innerHTML=`
      <div class="modal-existing">
        <div class="modal-existing-label">Actualmente registrado</div>
        <div class="modal-existing-val">${formatH(entry.hours)}${entry.note?` · ${entry.note}`:''}</div>
      </div>`;
    const hh=Math.floor(entry.hours), mm=Math.round((entry.hours-hh)*60);
    document.getElementById('inp-hours').value=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    document.getElementById('inp-note').value=entry.note||'';
    document.getElementById('btn-delete-day').style.display='block';
  } else {
    document.getElementById('modal-title').textContent='Registrar horas';
    existing.innerHTML='';
    document.getElementById('inp-hours').value='03:00';
    document.getElementById('inp-note').value='';
    document.getElementById('btn-delete-day').style.display='none';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-hours').focus(),150);
}

function closeModal(e){ if(e.target===document.getElementById('overlay')) closeModalDirect(); }
function closeModalDirect(){ document.getElementById('overlay').classList.remove('open'); selectedDateStr=null; }

function saveEntry(){
  const hours=timeToH(document.getElementById('inp-hours').value);
  const note=document.getElementById('inp-note').value.trim();
  if(!hours){alert('Las horas no pueden ser 0.');return;}
  entries=entries.filter(e=>e.date!==selectedDateStr);
  entries.push({id:Date.now(),date:selectedDateStr,hours,note});
  save();closeModalDirect();render();
}

function deleteDayEntry(){
  entries=entries.filter(e=>e.date!==selectedDateStr);
  save();closeModalDirect();render();
}

function changeMonth(dir){ viewDate.setMonth(viewDate.getMonth()+dir); renderCalendar(); }
function goToday(){ viewDate=new Date(); renderCalendar(); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModalDirect();
  if(e.key==='Enter' && document.getElementById('overlay').classList.contains('open')) saveEntry();
});

function render(){ renderKPIs(); renderEntries(); renderCalendar(); renderWeekBars(); }
render();
</script>
